[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cve-server"
version = "0.1.0"
description = "HTTP API for PlainFlow"
requires-python = ">=3.11"
dependencies = [
    "cve-engine[llm]",
    "fastapi",
    "uvicorn",
    "httpx",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
